<!doctype html><html lang='pl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CRM Sprzedaży — Biuro Rachunkowe</title><link rel='stylesheet' href='styles.css'></head><body>
<div class='shell'>
<aside><div class='brand'>BR<span>CRM</span></div><nav>
<button data-view='dashboard' class='active'>Dashboard</button><button data-view='pipeline'>Pipeline</button><button data-view='leads'>Leady</button><button data-view='reports'>Raporty</button><button data-view='settings'>Ustawienia</button></nav><div class='aside-note'>MVP • dane zapisują się lokalnie w tej przeglądarce.</div></aside>
<main><header><div><h1 id='viewTitle'>Dashboard</h1><p id='subtitle'>Przepływ leadów i najważniejsze wskaźniki sprzedaży.</p></div><button id='addLead' class='primary'>+ Dodaj leada</button></header><section id='app'></section></main></div>
<div id='modal' class='modal hidden'><div class='modal-card'><div class='modal-head'><h2>Nowy lead</h2><button id='closeModal'>×</button></div><form id='leadForm'><div class='grid2'><label>Firma<input name='company' required></label><label>Osoba kontaktowa<input name='contact' required></label><label>E-mail<input name='email' type='email'></label><label>Telefon<input name='phone'></label><label>Źródło<select name='source'><option>Google Ads</option><option>SEO</option><option>Polecenie</option><option>Partner</option><option>Social media</option><option>Formularz WWW</option><option>Telefon</option></select></label><label>Potencjalny MRR (zł)<input name='mrr' type='number' min='0' value='1000'></label><label>Segment<select name='grade'><option>A</option><option>B</option><option>C</option></select></label><label>Termin follow-up<input name='followup' type='date'></label></div><label>Notatka<textarea name='note' rows='3'></textarea></label><button class='primary wide'>Zapisz lead</button></form></div></div>
<script src='app.js'></script></body></html>
