<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRCRM — CRM biura rachunkowego</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell">
<aside>
  <div class="brand"><span class="brand-mark">▥</span> BR<span>CRM</span></div>
  <div class="nav-scroll">
    <div class="nav-section">OGÓLNE</div>
    <nav>
      <button data-view="dashboard" class="active"><span>⌂</span>Pulpit</button>
      <button data-view="stats"><span>◌</span>Statystyki</button>
      <button data-view="users"><span>♙</span>Użytkownicy</button>
      <button data-view="history"><span>◴</span>Historia zmian</button>
      <button data-view="reminders"><span>◫</span>Przypomnienia</button>
      <button data-view="emails"><span>✉</span>Wiadomości e-mail</button>
    </nav>

    <div class="nav-section">KLIENCI I SPRZEDAŻ</div>
    <nav>
      <button data-view="clients"><span>▤</span>Klienci</button>
      <button data-view="leads"><span>♧</span>Leady / Potencjalni klienci</button>
      <button data-view="pipeline"><span>◉</span>Szanse sprzedaży</button>
      <button data-view="offers"><span>◇</span>Oferty</button>
      <button data-view="notes"><span>✎</span>Notatki</button>
    </nav>

    <div class="nav-section">AUTOMATYZACJE</div>
    <nav>
      <button data-view="automations"><span>ϟ</span>Automatyzacje</button>
      <button data-view="templates"><span>▧</span>Szablony dokumentów</button>
      <button data-view="sequences"><span>↪</span>Sekwencje e-mail</button>
    </nav>

    <div class="nav-section">USTAWIENIA</div>
    <nav>
      <button data-view="integrations"><span>⌘</span>Integracje</button>
      <button data-view="settings"><span>⚙</span>Ustawienia systemu</button>
    </nav>
  </div>
  <div class="aside-note">BRCRM • CRM sprzedażowy</div>
</aside>

<main>
  <div class="topbar">
    <div class="crumb" id="crumb">OGÓLNE / Pulpit</div>
    <div class="global-search">⌕ <input id="globalSearch" placeholder="Szukaj w CRM..."></div>
    <button class="notification">♧<b>3</b></button>
    <div class="user-chip"><span>AK</span><div><b>Anna Kowalczyk</b><small>Pracownik</small></div><i>⌄</i></div>
  </div>
  <header>
    <div><h1 id="viewTitle">Pulpit</h1><p id="subtitle">Najważniejsze informacje z Twojego biura rachunkowego.</p></div>
    <button id="addLead" class="primary">+ Dodaj lead</button>
  </header>
  <section id="app"><div class="loading-card">Łączenie z bazą danych…</div></section>
</main></div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>Nowy lead</h2><button id="closeModal">×</button></div><form id="leadForm"><div class="grid2"><label>Firma<input name="company" required></label><label>Osoba kontaktowa<input name="contact" required></label><label>E-mail<input name="email" type="email"></label><label>Telefon<input name="phone"></label><label>Źródło<select name="source"><option>Google Ads</option><option>SEO</option><option>Polecenie</option><option>Partner</option><option>Social media</option><option>Formularz WWW</option><option>Telefon</option><option>Inne</option></select></label><label>Potencjalny MRR (zł)<input name="mrr" type="number" min="0" value="1000"></label><label>Segment<select name="grade"><option>A</option><option selected>B</option><option>C</option></select></label><label>Opiekun<input name="owner" placeholder="np. Anna Kowalczyk"></label><label>Termin follow-up<input name="followup" type="date"></label></div><label>Notatka<textarea name="note" rows="3"></textarea></label><button class="primary wide">Zapisz lead</button></form></div></div>
<script src="app.js"></script></body></html>
